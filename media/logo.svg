<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>TorchViewer Logo</title>
  <desc>两条独立绘制的鱼形模块以 180° 旋转对称互相缠绕：紫色与绿色阴阳相生，鱼眼分别内置代码符号与网络拓扑，寓意代码（模型）与可视化互相依存、互为表里。</desc>

  <!-- 绿色鱼：头部在下（r44 正圆西弧），身体沿 R94 外弧东行，尾部以 r6 圆角收于东北 -->
  <path d="M 128 222
           A 44 44 0 1 1 128 134
           A 56 56 0 0 0 182.6 65.4
           A 6 6 0 0 1 192.5 59.6
           A 94 94 0 0 1 128 222 Z"
        fill="#00D4C0"/>

  <!-- 紫色鱼：与绿鱼 180° 旋转对称，头部在上（r44 正圆东弧），身体沿 R94 外弧西行，尾部圆角收于西南 -->
  <path d="M 128 34
           A 44 44 0 1 1 128 122
           A 56 56 0 0 0 73.4 190.6
           A 6 6 0 0 1 63.5 196.4
           A 94 94 0 0 1 128 34 Z"
        fill="#7C4DFF"/>

  <!-- 鱼眼：互为反色的小圆底，内置简笔图案 -->
  <circle cx="128" cy="78" r="24" fill="#00D4C0"/>
  <circle cx="128" cy="178" r="24" fill="#7C4DFF"/>

  <!-- 上鱼眼：代码符号 </> -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 119 70 L 111.5 78 L 119 86"/>
    <path d="M 137 70 L 144.5 78 L 137 86"/>
    <path d="M 131.5 67 L 124.5 89"/>
  </g>

  <!-- 下鱼眼：星型网络拓扑，中心节点连四颗卫星 -->
  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <path d="M 128 178 L 139 170"/>
    <path d="M 128 178 L 117 170"/>
    <path d="M 128 178 L 139 186"/>
    <path d="M 128 178 L 117 186"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="139" cy="170" r="2.4"/>
    <circle cx="117" cy="170" r="2.4"/>
    <circle cx="139" cy="186" r="2.4"/>
    <circle cx="117" cy="186" r="2.4"/>
  </g>
  <circle cx="128" cy="178" r="3.4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="128" cy="178" r="1.2" fill="#FFFFFF"/>
</svg>
